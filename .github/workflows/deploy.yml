name: Build and deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so CI matches the local toolchain. The project currently uses
  # Gradle 9.1.0 / AGP 9.0.1 / Kotlin 2.3.20, which Flutter 3.50+ rejects as
  # below its hard minimums (Gradle 9.3.1 / AGP 9.1.1 / KGP 2.4.10).
  # Bump this together with android/gradle/wrapper/gradle-wrapper.properties
  # and android/settings.gradle.kts.
  FLUTTER_VERSION: '3.44.2'

jobs:
  build-android:
    name: Build Android artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set - release artifacts will be signed with the debug key."
          fi

      - name: Build release APK and App Bundle
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  deploy-web:
    name: Deploy Flutter web to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release

      # The secrets context is not available in job-level `if`, so the
      # deploy steps are gated on this output instead.
      - name: Check for Firebase credentials
        id: firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set - skipping the Firebase Hosting deploy."
          fi

      - name: Authenticate to Google Cloud
        if: steps.firebase.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Set up Node.js
        if: steps.firebase.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Firebase CLI
        if: steps.firebase.outputs.configured == 'true'
        run: npm install --global firebase-tools

      - name: Deploy to Firebase Hosting
        if: steps.firebase.outputs.configured == 'true'
        run: firebase deploy --only hosting --project voiceai-3338c --non-interactive
